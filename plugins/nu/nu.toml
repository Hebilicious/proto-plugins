format = "2"

[plugin]
description = "Nushell plugin for proto."
homepage_url = "https://www.nushell.sh/"
repository_url = "https://github.com/Hebilicious/proto-plugins"

[metadata]
name = "Nushell"
type = "command-line"
default_version = "stable"
minimum_proto_version = "0.63.0"

[detect]
files = [".nu-version", ".nushell-version"]

[source.aliases]
stable = "latest"

[resolve]
git_url = "https://github.com/nushell/nushell"

[install]
download_url = "https://github.com/nushell/nushell/releases/download/{version}/{download_name}"
checksum_url = "https://github.com/nushell/nushell/releases/download/{version}/{checksum_name}"
checksum_name = "SHA256SUMS"

[locate]
exes_dirs = ["."]

[locate.exes.nu]
exe_path = "nu"
primary = true

[locate.exes.nu_plugin_custom_values]
exe_path = "nu_plugin_custom_values"

[locate.exes.nu_plugin_example]
exe_path = "nu_plugin_example"

[locate.exes.nu_plugin_formats]
exe_path = "nu_plugin_formats"

[locate.exes.nu_plugin_gstat]
exe_path = "nu_plugin_gstat"

[locate.exes.nu_plugin_inc]
exe_path = "nu_plugin_inc"

[locate.exes.nu_plugin_polars]
exe_path = "nu_plugin_polars"

[locate.exes.nu_plugin_query]
exe_path = "nu_plugin_query"

[locate.exes.nu_plugin_stress_internals]
exe_path = "nu_plugin_stress_internals"

[platform.linux]
archs = ["x64", "arm64"]
download_name = "nu-{version}-{arch}-unknown-linux-{libc}.tar.gz"
archive_prefix = "nu-{version}-{arch}-unknown-linux-{libc}"

[platform.macos]
archs = ["x64", "arm64"]
download_name = "nu-{version}-{arch}-apple-darwin.tar.gz"
archive_prefix = "nu-{version}-{arch}-apple-darwin"

[platform.windows]
archs = ["x64", "arm64"]
download_name = "nu-{version}-{arch}-pc-windows-msvc.zip"
archive_prefix = "nu-{version}-{arch}-pc-windows-msvc"
