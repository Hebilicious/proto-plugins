$schema: "https://moonrepo.dev/schemas/project.json"

layer: "tool"
tags: ["proto-plugin", "toml"]

fileGroups:
  sources:
    - "hk.toml"
  tests:
    - "tests/e2e/**/*"

tasks:
  e2e:
    script: "./tests/e2e/run.sh"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
    options:
      cache: false
