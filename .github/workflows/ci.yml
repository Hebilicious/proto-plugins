name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache: false

      - name: Install Rust components
        run: |
          rustup toolchain uninstall 1.94.1-x86_64-unknown-linux-gnu || true
          rustup toolchain install 1.94.1 --profile default --component rustfmt --target wasm32-wasip1

      - name: Run moon tasks
        run: |
          moon run proto-plugins:fmt
          moon run proto-plugins:test
          moon run proto-plugins:build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - hk
          - nu
          - ocaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Docker e2e
        run: ./plugins/${{ matrix.plugin }}/tests/e2e/run.sh
