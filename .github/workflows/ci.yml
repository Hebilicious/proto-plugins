name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache: false

      - name: Install Rust toolchain
        run: |
          proto install rust
          rust_bin_dir="$(proto bin rust --dir exes)"
          rust_toolchain="$(basename "$(dirname "${rust_bin_dir}")")"
          rustup component add rustfmt --toolchain "${rust_toolchain}"
          rustup target add wasm32-wasip1 --toolchain "${rust_toolchain}"
          echo "RUSTUP_TOOLCHAIN=${rust_toolchain}" >> "${GITHUB_ENV}"
          echo "${rust_bin_dir}" >> "${GITHUB_PATH}"

      - name: Run moon tasks
        run: |
          moon run proto-plugins:fmt
          moon run proto-plugins:test
          moon run proto-plugins:build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - hk
          - nu
          - ocaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Docker e2e
        run: ./plugins/${{ matrix.plugin }}/tests/e2e/run.sh
