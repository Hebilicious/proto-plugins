name: Release

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  release_pr:
    name: Release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache: false
      - name: Install Rust components
        run: |
          proto install rust
          rust_toolchain="$(basename "$(dirname "$(proto bin rust --dir exes)")")"
          rustup component add rustfmt --toolchain "${rust_toolchain}"
          rustup target add wasm32-wasip1 --toolchain "${rust_toolchain}"
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}-release
      cancel-in-progress: false
    outputs:
      releases: ${{ steps.release.outputs.releases }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache: false
      - name: Install Rust components
        run: |
          proto install rust
          rust_toolchain="$(basename "$(dirname "$(proto bin rust --dir exes)")")"
          rustup component add rustfmt --toolchain "${rust_toolchain}"
          rustup target add wasm32-wasip1 --toolchain "${rust_toolchain}"
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.release.tag }}

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache: false

      - name: Install Rust components
        run: |
          proto install rust
          rust_toolchain="$(basename "$(dirname "$(proto bin rust --dir exes)")")"
          rustup component add rustfmt --toolchain "${rust_toolchain}"
          rustup target add wasm32-wasip1 --toolchain "${rust_toolchain}"

      - name: Install WASM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen wabt

      - name: Build release artifact
        shell: bash
        env:
          PACKAGE: ${{ matrix.release.package_name }}
        run: |
          set -euo pipefail

          mkdir -p builds
          cargo build --release --target wasm32-wasip1 --package "${PACKAGE}"

          input="target/wasm32-wasip1/release/${PACKAGE}.wasm"
          output="builds/${PACKAGE}.wasm"

          wasm-opt -Os "${input}" --output "${output}"
          wasm-strip "${output}"
          sha256sum "${output}" | awk '{ print $1 }' > "${output}.sha256"

      - name: Extract release notes
        shell: bash
        env:
          PACKAGE: ${{ matrix.release.package_name }}
          VERSION: ${{ matrix.release.version }}
        run: |
          set -euo pipefail

          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { in_section=1 }
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            in_section { print }
          ' "plugins/${PACKAGE}/CHANGELOG.md" > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "See plugins/${PACKAGE}/CHANGELOG.md for release notes." > release-notes.md
          fi

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: builds/${{ matrix.release.package_name }}.wasm,builds/${{ matrix.release.package_name }}.wasm.sha256
          artifactErrorsFailBuild: true
          bodyFile: release-notes.md
          makeLatest: true
          name: ${{ matrix.release.package_name }} v${{ matrix.release.version }}
          prerelease: ${{ contains(matrix.release.version, '-alpha') || contains(matrix.release.version, '-beta') || contains(matrix.release.version, '-rc') }}
          replacesArtifacts: true
          tag: ${{ matrix.release.tag }}
